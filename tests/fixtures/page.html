<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Null Invaders test page</title>
<style>
  body { font: 18px/1.6 system-ui; margin: 0; background: #101514; color: #e1ebdb }
  main { max-width: 900px; margin: auto; padding: 40px 24px }
  h1 { font-size: 64px; line-height: 1.05; margin: 0 0 24px }
  button { font: inherit; padding: 10px 20px; border-radius: 24px; border: 1px solid #8b9e82; background: #1d2a26; color: inherit }
  .bar { position: sticky; top: 0; padding: 12px 24px; background: #101514 }
</style>
<div class="bar" data-virus-ignore><button id="start">Play</button><button id="stop">Recall</button></div>
<main id="board">
  <h1>The page is your playground.</h1>
  <p>Real words. Real buttons. A tiny arcade world hiding in the document, with <a href="#away" id="link">a link</a> inside.</p>
  <button id="factory" style="color: rgb(1, 2, 3)">First factory</button>
  <h2>Make something unexpected.</h2>
  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. A hundred small observations turn into something new.</p>
  <button>Second factory</button>
  <form><p>Protected text in a form.</p><input id="field" placeholder="Typing stays yours" /></form>
</main>
<script type="module">
  import { createNullInvaders } from "/dist/index.js";
  const q = new URLSearchParams(location.search);
  window.createNullInvaders = createNullInvaders;
  window.launch = (extra = {}) => {
    window.game?.destroy();
    window.game = createNullInvaders({ root: "#board", seed: 11, sound: false, ...(q.has("bare") ? { targetSelector: "[data-none]" } : {}), ...extra });
    return window.game.start();
  };
  document.querySelector("#start").onclick = () => window.launch();
  document.querySelector("#stop").onclick = () => window.game?.destroy();
</script>
</html>
